# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "zc.sourcefactory"
version = "3.1.dev0"
description = "An easy way to create custom Zope sources."
license = "ZPL-2.1"
classifiers = [
    "Topic :: Software Development",
    "Framework :: Zope :: 3",
    "Framework :: Zope :: 4",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Zope Foundation and contributors",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "ZODB",
    "persistent",
    "zope.intid",
    "zope.browser",
    "zope.component",
    "zope.dublincore",
    "zope.interface",
    "zope.proxy",
    "zope.publisher",
    "zope.schema",
]
keywords = ["zope", "vocabulary", "source", "factory"]

[project.optional-dependencies]
test = [
    "zope.component[zcml]",
    "persistent >= 4.4.3",
    "zope.site",
    "zope.testing",
    "zope.testrunner >= 6.4",
    "zope.keyreference",
]

[project.urls]
Source = "https://github.com/zopefoundation/zc.sourcefactory"
Issues = "https://github.com/zopefoundation/zc.sourcefactory/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/zc.sourcefactory/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["zc.sourcefactory"]

[tool.coverage.report]
fail_under = 88
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}

[tool.zest-releaser]
create-wheel = false
extra-message = ""
upload-pypi = false
